<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="none" />
  
  <g stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 外圈大弧线（保持原本的完美对称） -->
    <path d="M 126.8 200 A 400 400 0 0 1 473.2 200" />
    <path d="M 473.2 200 A 400 400 0 0 1 300 500" />
    <path d="M 300 500 A 400 400 0 0 1 126.8 200" />
    
    <!-- 从顶点 A (126.8, 200) 出发的内部弧线 -->
    <path d="M 126.8 200 A 240 240 0 0 1 300 270" />
    <path d="M 126.8 200 A 240 240 0 0 0 274 315" />
    
    <!-- 从顶点 B (473.2, 200) 出发的内部弧线 -->
    <path d="M 473.2 200 A 240 240 0 0 1 326 315" />
    <path d="M 473.2 200 A 240 240 0 0 0 300 270" />
    
    <!-- 从顶点 C (300, 500) 出发的内部弧线 -->
    <path d="M 300 500 A 240 240 0 0 1 274 315" />
    <path d="M 300 500 A 240 240 0 0 0 326 315" />
    
    <!-- 中心小三角闭合弧线（三边凸出） -->
    <path d="M 300 270 A 52 52 0 0 0 274 315" />
    <path d="M 274 315 A 52 52 0 0 0 326 315" />
    <path d="M 326 315 A 52 52 0 0 0 300 270" />

  </g>
</svg>
